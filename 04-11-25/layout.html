<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layouts</title>
    <style>
    html, body { height: 100%; }

    body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #474141;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    }
        .box {
            display: flex;
            
            
            background-color: #393838;
            height: 100%;
            width: 100%;
        }
        .navbar {
            background-color: #000000;
            height: 70px;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            border-style: solid;
            
            
           
            

        }
        .circle {
            background-color: #a4a4a4;
            height: 55px;
            width: 55px;
            border-radius: 50%;
            margin: 10px;
            

           
        }
        .navrect {
            background-color: #a4a4a4;
            height: 30px;
            width: 175px;
            border-radius: 1px;
            margin: 20px;
            
        }
        .roundrect {
            background-color: #a4a4a4;
            height: 45px;
            width: 350px;
            border-radius: 20px;
            margin: 15px;
        }
        
        
    </style>
</head>
<body>
    <div class="box">
        <nav class="navbar">
            
            <div class="circle">

            </div>
            
             <div class="navrect">

            </div>
            
            <div class="navrect">

            </div>
            <div class="navrect">

            </div>
           
            <div class="roundrect">

            </div>
            <div class="circle">

            </div>
           

        </nav>


    </div>
    
</body>
</html>

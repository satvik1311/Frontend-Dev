<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .pricing-card {
      transition: all 0.3s ease;
    }
    .pricing-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5 text-center">
    <h2 class="fw-bold mb-5">Choose Your Plan</h2>
    <div class="row g-4">

      <div class="col-12 col-md-4">
        <div class="card pricing-card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title fw-bold mb-3">Basic</h5>
            <h3 class="fw-bold mb-3">$9<span class="fs-6 text-muted">/mo</span></h3>
            <ul class="list-unstyled mb-4">
              <li>✔ 5 Projects</li>
              <li>✔ 10GB Storage</li>
              <li>✔ Email Support</li>
            </ul>
            <button class="btn btn-outline-primary">Select</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card pricing-card shadow-sm h-100 bg-primary text-white">
          <div class="card-body">
            <h5 class="card-title fw-bold mb-3">Pro</h5>
            <h3 class="fw-bold mb-3">$29<span class="fs-6 text-light">/mo</span></h3>
            <ul class="list-unstyled mb-4">
              <li>✔ Unlimited Projects</li>
              <li>✔ 100GB Storage</li>
              <li>✔ Priority Support</li>
            </ul>
            <button class="btn btn-light text-primary fw-bold">Get Started</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card pricing-card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title fw-bold mb-3">Enterprise</h5>
            <h3 class="fw-bold mb-3">$59<span class="fs-6 text-muted">/mo</span></h3>
            <ul class="list-unstyled mb-4">
              <li>✔ Dedicated Account</li>
              <li>✔ Unlimited Storage</li>
              <li>✔ 24/7 Support</li>
            </ul>
            <button class="btn btn-outline-primary">Contact Sales</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

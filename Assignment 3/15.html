<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Form</title>
</head>
<body>
  <h2>Payment</h2>
  <form>
    Cardholder Name: <input type="text" required><br><br>
    Card Number: <input type="text" required><br><br>
    Expiry Date: <input type="month" required><br><br>
    CVV: <input type="number" required><br><br>
    <input type="submit" value="Pay Now">
  </form>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quotes</title>
</head>
<body>
  <blockquote>
    "The only limit to our realization of tomorrow is our doubts of today." &amp;
  </blockquote>
  <p>He said, <q>This is a short quote.</q></p>
</body>
</html>

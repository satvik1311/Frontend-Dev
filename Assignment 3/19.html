<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Form</title>
</head>
<body>
  <h2>Secure Form</h2>
  <form autocomplete="off">
    Username: <input type="text" required><br><br>
    Password: <input type="password" required><br><br>
    <input type="submit" value="Login">
  </form>
  <p>Turning off autocomplete prevents browsers from storing sensitive information, improving security.</p>
</body>
</html>

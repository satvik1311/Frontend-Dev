<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The <title> tag sets the title of the webpage shown in the browser tab -->
    <title>My Sample Webpage</title>

    <!-- <meta charset="UTF-8"> specifies the character encoding for the HTML document -->
    <meta charset="UTF-8">

    <!-- <meta name="description"> provides a short description of the webpage for search engines -->
    <meta name="description" content="This is a sample webpage including all important head elements.">

    <!-- <meta name="author"> specifies the author of the webpage -->
    <meta name="author" content="Satvik Gaur">

    <!-- <base> sets the base URL for all relative URLs in the page -->
    <base href="https://www.example.com/">

    <!-- <link> is used to link external resources like favicon, stylesheets, etc. -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- <style> allows adding internal CSS; currently empty -->
    <style>
        /* Add your CSS styles here */
    </style>

    <!-- <script> allows adding JavaScript; currently empty -->
    <script>
        // Add your JavaScript code here
    </script>
</head>
<body>
    <h1>Welcome to My Sample Webpage</h1>
    <p>This page demonstrates all important head elements with comments.</p>
</body>
</html>


<!-- Create a page that includes all important <head> elements:
● <title>
● <meta> (charset, description, author)
● <base> (to set base URL)
● <link> (to favicon or other resource)
● <style> (can be empty)
● <script> (can be empty)
Add comments explaining what each tag is used for. -->

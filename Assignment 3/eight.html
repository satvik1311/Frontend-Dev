<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback Form</title>
</head>
<body>
  <h2>Feedback</h2>
  <form method="post" action="#">
    Feedback:<br>
    <textarea name="feedback" required></textarea><br><br>
    Rating:<br>
    <input type="radio" name="rating" value="Good" required>Good
    <input type="radio" name="rating" value="Average">Average
    <input type="radio" name="rating" value="Poor">Poor<br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
<!-- 
8. Design a Feedback Form that includes:
● A textarea for feedback
● Radio buttons for rating (Good, Average, Poor)
● A submit button
Use method="post" and action="#". -->

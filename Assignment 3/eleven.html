<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Form</title>
</head>
<body>
  <h2>Student Information</h2>
  <form>
    Name: <input type="text" name="name" required><br><br>
    Roll Number: <input type="text" name="roll" required><br><br>
    Course: 
    <select required>
      <option selected disabled>Select Course</option>
      <option>Computer Science</option>
      <option>Mathematics</option>
      <option>Physics</option>
    </select><br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>

<!-- 11. Design a form that collects student information — Name, Roll Number, and Course.
Use a <select> dropdown for choosing a course.
Include an option that says “Select Course” as default (disabled and selected). -->

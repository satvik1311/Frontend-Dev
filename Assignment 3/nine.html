<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload</title>
</head>
<body>
  <h2>Upload an Image</h2>
  <p>Only .jpg and .png files are allowed.</p>
  <form>
    <input type="file" accept=".jpg,.png" required>
    <input type="submit" value="Upload">
  </form>
</body>
</html>


<!-- 9. Create a File Upload Form where users can upload only .jpg or .png files.
Use the accept attribute to restrict file types.
Include a short note in a <p> tag describing what kind of files are allowed. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
</head>
<body>
  <h2>User Registration</h2>
  <form>
    Full Name: <input type="text" name="fullname" required><br><br>
    Email Address: <input type="email" name="email" required><br><br>
    Password: <input type="password" name="password" required><br><br>
    Confirm Password: <input type="password" name="confirm" required><br><br>
    <input type="submit" value="Register">
  </form>
</body>
</html>

<!-- 6. Create a User Registration Form with the following fields:
● Full Name
● Email Address
● Password

● Confirm Password
Make all fields required using the required attribute. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
</head>
<body>
  <h2>Contact Us</h2>
  <form>
    Full Name: <input type="text" placeholder="Enter full name" required><br><br>
    Email: <input type="email" placeholder="Enter email" required><br><br>
    Subject: <input type="text" placeholder="Enter subject" required><br><br>
    Message: <textarea placeholder="Enter your message" required></textarea><br><br>
    <input type="submit" value="Send">
  </form>
</body>
</html>

● Email
● Subject
● Message (textarea)
Use the placeholder and required attributes properly. -->

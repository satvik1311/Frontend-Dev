<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Map</title>
</head>
<body>
  <h2>GLA University Map</h2>
  <iframe 
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3535.6345449447913!2d77.5970353!3d27.604857700000004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39736ce47bffc039%3A0xfe5fc3da92c6341!2sGLA%20University!5e0!3m2!1sen!2sin!4v1760505977851!5m2!1sen!2sin"
    title="Map showing GLA University"
    width="80%" height="45%"
    loading="lazy">
  </iframe>
  <!-- loading="lazy" delays loading the iframe until near viewport -->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding Demonstration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .container {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 40px;
    }

    .box {
      width: 180px;
      height: 120px;
      background-color: white;
      text-align: center;
      line-height: 120px;
      font-weight: bold;
      transition: border-color 0.3s ease;
    }

    
    .solid { border: 4px solid #3498db; padding: 10px; }
    .dashed { border: 4px dashed #e67e22; padding: 20px; }
    .double { border: 6px double #27ae60; padding: 15px; }
    .groove { border: 6px groove #8e44ad; padding: 25px; }

    .rounded { border-radius: 15px; }

    
    .box:hover {
      border-color: #ff4757;
    }
  </style>
</head>
<body>

  <h1>🌈 Borders and Padding Demonstration</h1>

  <div class="container">
    <div class="box solid">Solid Border</div>
    <div class="box dashed">Dashed Border</div>
    <div class="box double">Double Border</div>
    <div class="box groove">Groove Border</div>
    <div class="box solid rounded">Rounded Corners</div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar with Hover Effects</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #ecf0f1;
    }

    nav {
      background: #2c3e50;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      padding: 15px 25px;
      text-decoration: none;
      display: block;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
    }

    nav a:hover {
      background: #34495e;
      border-bottom: 3px solid #1abc9c;
    }

    nav a.active {
      background: #1abc9c;
    }

    footer {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 10px 0;
      margin-top: 50px;
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="active">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Portfolio</a>
    <a href="#">Contact</a>
  </nav>

  <footer>
    © 2025 Demo Navigation | Designed by Satvik
  </footer>

</body>
</html>

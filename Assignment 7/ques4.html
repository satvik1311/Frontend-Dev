<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth Effect Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .card {
      background-color: #fff;
      width: 250px;
      height: 320px;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    /* Different shadow styles */
    .shadow1 { box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
    .shadow2 { box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); }
    .shadow3 { box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25); }

    /* Hover lift effect */
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 10px;
      color: #333;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    p {
      margin-top: 10px;
      color: #555;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-top: 15px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card shadow1">
      <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile 1">
      <h2>John Doe</h2>
      <p>Frontend Developer passionate about creating clean, responsive, and interactive web interfaces.</p>
    </div>

    <div class="card shadow2">
      <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile 2">
      <h2>Sarah Lee</h2>
      <p>UI/UX Designer focused on crafting intuitive designs with engaging user experiences.</p>
    </div>

    <div class="card shadow3">
      <img src="https://randomuser.me/api/portraits/men/58.jpg" alt="Profile 3">
      <h2>Michael Chen</h2>
      <p>Full Stack Engineer with a love for scalable systems and smooth animations.</p>
    </div>
  </div>

</body>
</html>

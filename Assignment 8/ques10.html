<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini UI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #eef2f7;
      color: #333;
    }

    header, footer {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 { font-size: 1.8rem; }
    footer { font-size: 0.9rem; }

    main {
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 380px;
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input, button {
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
    }

    input {
      border: 1px solid #ddd;
    }
    input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    button:hover {
      background: #2980b9;
    }

    @media (max-width: 500px) {
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <header><h1>Mini App</h1></header>
  <main>
    <div class="card">
      <img src="https://picsum.photos/400/200" alt="Header Image">
      <form>
        <input type="text" placeholder="Name" required />
        <input type="email" placeholder="Email" required />
        <button type="submit">Submit</button>
      </form>
    </div>
  </main>
  <footer>&copy; 2025 Mini UI</footer>
</body>
</html>

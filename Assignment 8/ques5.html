<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Button Styles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #f5f7fa;
      padding: 50px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .btn-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    }

    /* Primary */
    .btn-primary {
      background: #3498db;
      color: white;
    }
    .btn-primary:hover { background: #2980b9; transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:focus { outline: 3px solid #a8d0e6; }

    /* Secondary */
    .btn-secondary {
      background: #95a5a6;
      color: white;
    }
    .btn-secondary:hover { background: #7f8c8d; }

    /* Outline */
    .btn-outline {
      background: transparent;
      color: #3498db;
      border: 2px solid #3498db;
    }
    .btn-outline:hover {
      background: #3498db;
      color: white;
    }

    /* Disabled */
    .btn-disabled {
      background: #bdc3c7;
      color: #7f8c8d;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-disabled:hover { transform: none; }

    @media (max-width: 500px) {
      .btn-container { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="btn-container">
    <button class="btn-primary">Primary</button>
    <button class="btn-secondary">Secondary</button>
    <button class="btn-outline">Outline</button>
    <button class="btn-disabled" disabled>Disabled</button>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dash-Drop</title>
</head>
<body>
    <div style="background-color: #213086; color: white; padding: 20px; display: flex; justify-content: space-between;">
        <h2>Dash-Drop</h2>
        <span>Available Credits: 9.989 <button style="background-color: #00ffcc; border: none; padding: 5px 10px;">Connect Wallet</button></span>
    </div>

    <div style="display: flex; background-color: #1a1f3a; color: white; padding: 20px;">
        <div style="width: 200px; background-color: #0d1117; padding: 10px;">
            <h3>Nodes</h3>
        </div>
        <div style="padding-left: 20px;">
            <h3>Add Node</h3>
            <div>
                <h4>Select Chain</h4>
                <img src="image.png" alt="Ethereum" style="margin-right: 10px; width: 60px; height: 60px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/1024px-Bitcoin.svg.png" alt="Bitcoin" style="margin-right: 10px; width: 60px; height: 60px;">
                <img src="https://thumbs.dreamstime.com/z/solana-sol-cryptocurrency-physical-coin-placed-crypto-altcoins-lit-orange-blue-lights-dark-backgrond-macro-shot-247931560.jpg?ct=jpeg" alt="Solana" style="width: 60px; height: 60px;">
            </div>
            <div>
                <h4>Select Environment</h4>
                <input type="radio" name="environment" id="devnet"><label for="devnet">Dev Net</label>
                <input type="radio" name="environment" id="testnet"><label for="testnet">Test Net</label>
                <input type="radio" name="environment" id="mainnet" checked><label for="mainnet">Main Net</label>
            </div>
            <div>
                <h4>Price:</h4>
                <span>₹ 5.99</span>
            </div>
            <div>
                <button style="background-color: #333; border: none; padding: 10px; margin-right: 10px;">Cancel</button>
                <button style="background-color: #00ffcc; border: none; padding: 10px;">Add Node</button>
            </div>
        </div>
    </div>
</body>
</html>

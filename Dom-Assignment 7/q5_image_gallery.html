<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Gallery With Modal</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(3, 150px);
        gap: 15px;
    }

    .gallery img {
        width: 150px;
        height: 100px;
        object-fit: cover;
        cursor: pointer;
        border-radius: 5px;
        transition: 0.2s;
    }

    .gallery img:hover {
        transform: scale(1.05);
    }

    /* Modal */
    #modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
        display: none;
        align-items: center;
        justify-content: center;
    }

    #modalContent {
        background: white;
        padding: 10px;
        border-radius: 8px;
        max-width: 80%;
        max-height: 80%;
    }

    #modalContent img {
        width: 100%;
        height: auto;
        display: block;
    }
</style>

</head>
<body>

<h2>Image Gallery</h2>

<div class="gallery">
    <img src="https://picsum.photos/seed/1/300/200">
    <img src="https://picsum.photos/seed/2/300/200">
    <img src="https://picsum.photos/seed/3/300/200">
    <img src="https://picsum.photos/seed/4/300/200">
    <img src="https://picsum.photos/seed/5/300/200">
    <img src="https://picsum.photos/seed/6/300/200">
</div>

<!-- Modal -->
<div id="modal">
    <div id="modalContent">
        <img id="modalImage" src="">
    </div>
</div>

<script>
"use strict";

const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImage");
const modalContent = document.getElementById("modalContent");

// When an image is clicked → show modal
document.querySelectorAll(".gallery img").forEach(img => {
    img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src;
    });
});

// Clicking outside modal closes it
modal.addEventListener("click", () => {
    modal.style.display = "none";
});

// Prevent inside modal from closing
modalContent.addEventListener("click", (event) => {
    event.stopPropagation(); // STOP bubbling
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Strength Checker</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    input {
        width: 300px;
        padding: 8px;
        font-size: 16px;
    }

    #strengthMsg {
        margin-top: 10px;
        font-size: 18px;
        font-weight: bold;
    }
</style>

</head>
<body>

<h2>Password Strength Checker</h2>

<input type="password" id="passwordInput" placeholder="Type your password...">

<p id="strengthMsg"></p>

<script>
"use strict";

const passwordInput = document.getElementById("passwordInput");
const strengthMsg = document.getElementById("strengthMsg");

// Function to calculate strength
function checkStrength(password) {
    let strength = 0;

    if (password.length >= 6) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[@$!%*?&#]/.test(password)) strength++;

    return strength;
}

passwordInput.addEventListener("input", () => {
    const pwd = passwordInput.value;
    const strength = checkStrength(pwd);

    if (pwd.length === 0) {
        strengthMsg.textContent = "";
        strengthMsg.style.color = "black";
        return;
    }

    if (strength <= 1) {
        strengthMsg.textContent = "Weak Password";
        strengthMsg.style.color = "red";
    } 
    else if (strength === 2 || strength === 3) {
        strengthMsg.textContent = "Medium Strength Password";
        strengthMsg.style.color = "orange";
    } 
    else if (strength === 4) {
        strengthMsg.textContent = "Strong Password";
        strengthMsg.style.color = "green";
    }
});
</script>

</body>
</html>

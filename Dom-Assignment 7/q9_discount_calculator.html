<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Discount Calculator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
    }
    input {
        padding: 8px;
        font-size: 16px;
        width: 200px;
        margin-right: 10px;
    }
    button {
        padding: 8px 15px;
        font-size: 16px;
        cursor: pointer;
    }
    #result {
        margin-top: 15px;
        font-size: 18px;
        font-weight: bold;
    }
</style>
</head>

<body>

<h2>Discount Calculator</h2>

<input type="number" id="price" placeholder="Original Price (₹)">
<input type="number" id="discount" placeholder="Discount (%)">
<button onclick="calculateDiscount()">Calculate</button>

<p id="result"></p>

<script>
"use strict";

function calculateDiscount() {
    const price = Number(document.getElementById("price").value);
    const discount = Number(document.getElementById("discount").value);
    const result = document.getElementById("result");

    if (isNaN(price) || isNaN(discount) || price <= 0 || discount < 0) {
        result.textContent = "Please enter valid numbers!";
        result.style.color = "red";
        return;
    }

    const discountAmount = (price * discount) / 100;
    const finalPrice = price - discountAmount;

    result.style.color = "green";
    result.textContent = `Final Price after discount: ₹${finalPrice.toFixed(2)} (You saved ₹${discountAmount.toFixed(2)})`;
}
</script>

</body>
</html>

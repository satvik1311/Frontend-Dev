<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="ques3.css">
</head>
<body>
    <h1 class="title">Filter Comparison Layout</h1>
    <div class="comparison-container">
        <div class="image-box">
            <img src="https://picsum.photos/id/1018/500/300" alt="Original Image">
            <p>Original Image</p>
        </div>
        <div class="image-box filtered">
            <img src="https://picsum.photos/id/1018/500/300" alt="Filtered Image">
            <p>Filtered (Brightness Reduced)</p>
        </div>
    </div>
</body>
</html>
